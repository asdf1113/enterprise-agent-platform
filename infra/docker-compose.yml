services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterprise-agent-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_dev
      POSTGRES_DB: enterprise_agent

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agent -d enterprise_agent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
