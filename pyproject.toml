[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Enterprise Agent Platform for knowledge retrieval, business data analysis, and enterprise workflow automation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "langgraph>=1.2.11",
    "openai>=3.10.0",
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
